name: Publish actuator lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage the reviewed static build and research artifacts
        run: |
          mkdir _site
          # Raw pen NPZ archives remain downloadable from the GitHub repository.
          # Keep Pages below its size limit; the viewer uses poses.bin and JSON.
          rsync -a --exclude='/isaac/pen/results/*/*.npz' --exclude=.git --exclude=.github --exclude=lab-src --exclude=_site ./ _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
